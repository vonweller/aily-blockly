<app-sub-window [title]="windowTitle" [winBtns]="['minimize', 'maximize', 'close']">
  <div class="process-detail-window">
    <app-chat-process-detail-panel
      [title]="command || processId || '终端命令'"
      [actionVisible]="!!outputFilePath"
      actionLabel="打开输出文件"
      actionIconClass="fa-light fa-arrow-up-right-from-square"
      [statusText]="displayStatus"
      [elapsedText]="summary ? formatElapsedMs(summary?.elapsedMs) : '-'"
      [exitCode]="summary?.exitCode ?? null"
      outputTitle="终端输出"
      [output]="output"
      emptyOutputText="暂无输出"
      (actionClick)="openOutputFile()"
    />
  </div>
</app-sub-window>
