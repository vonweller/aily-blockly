<section class="session-list-panel" [class.entry]="variant === 'entry'">
  <div class="session-list-header">
    <div class="session-list-title">{{ title }}</div>
    @if (showNewSession) {
    <button type="button" class="session-list-new-button" (click)="requestNewSession()">
      <i class="fa-light fa-plus"></i>
      <span>New Session</span>
    </button>
    }
  </div>

  <aily-chat-session-entries
    [groups]="groups"
    [items]="items"
    [selectedSessionId]="selectedSessionId"
    [listAriaLabel]="title"
    [emptyLabel]="emptyLabel"
    currentBadgeLabel="当前"
    variant="list"
    (selectSession)="selectSession.emit($event)"
    (actionClick)="actionClick.emit($event)"></aily-chat-session-entries>
</section>
